[package]
name = "rustycli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A Unix-like shell written in Rust"
license = "MIT"
repository = "https://github.com/tanishq0421/RustyCLI"
categories = ["command-line-utilities"]

[lib]
name = "rustycli"
path = "src/lib.rs"

[[bin]]
name = "rustycli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "1.0"
libc = "0.2"
nix = { version = "0.27", features = ["process", "signal", "fs"] }
regex = "1"
rustyline = "14"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
dirs = "5"
owo-colors = "4"
git2 = { version = "0.18", default-features = false }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[workspace]
exclude = ["fuzz"]
